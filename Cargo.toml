linux-x86_64 = "81f0d5b0960fb6adc8197030ffc827fba937640d51e73e39e0e9e40d88c66f6f"
linux-aarch64 = "0c8447e7bba9701467b5ac6155d157aa9e309e71af4981f78bd4b9176107f553"
windows-x86_64 = "301b1728317ccd84e984b02e366a8293735bc5ac618757d3d8f58b578f062411"
windows-arm64 = "7dba95db83ec1e8fa3f221c06454ebc692c8f06d93bf5fdf840113fa28018690"

[[bin]]
name = "cmake"
path = "src/main.rs"

[dependencies]
cmake = "0.1"

[build-dependencies]
shiguredo_toml = "2026.2"
