[package]
name = "shiguredo_cmake"
version = "4.4.3"
edition = "2024"
rust-version = "1.93"
description = "Download and cache prebuilt CMake binaries from official GitHub releases"
readme = "README.md"
homepage = "https://github.com/shiguredo/cmake-rs"
repository = "https://github.com/shiguredo/cmake-rs"
license = "Apache-2.0"
include = ["/build.rs", "/src/**", "LICENSE", "README.md"]

[package.metadata.external-dependencies.cmake]
version = "4.4.3"

[package.metadata.external-dependencies.cmake.sha256]
macos-universal = "0c5d65251c14cc884bfa16bdbed3c263ce5bffe2e21c0d0d00962cb0610464fa"
linux-x86_64 = "d6c83076c575bc00b823522ac974bda66d0af05d6ddc30e739c12385cf32c6cc"
linux-aarch64 = "2efc974dbd63b4444c0e8494b92f2e80c2d7e635b4b80eac2916985ddd8f72a6"
windows-x86_64 = "4d52ebab7193a698651639ed80d8d04fd903358843572cf44c7fd234cb7c26ab"
windows-arm64 = "7b410ddd00e24c7250eec7452da2348a4a70437aa87e9cda0a20d6a85662fcff"

[[bin]]
name = "cmake"
path = "src/main.rs"

[dependencies]
cmake = "0.1"

[build-dependencies]
shiguredo_toml = "2026.2"
