linux-x86_64 = "927b2368a946c37269c3a66225ab00544e756459cdd0b5d0da438694fb9ff802"
linux-aarch64 = "9ea38356dbd3e32e51029a3e09a0f2f8e117ef4fbcaad7a21ffb36409bbd5cb4"
windows-x86_64 = "935ade9e5e8723583c07f44c5592cea2a1c8f65c56ca7e07b34c025c880e0bd6"
windows-arm64 = "db6e902b5ba6a08d0abed136763c4bd95adda17e882d659c0f5d14fe158f7395"

[[bin]]
name = "cmake"
path = "src/main.rs"

[dependencies]
cmake = "0.1"

[build-dependencies]
