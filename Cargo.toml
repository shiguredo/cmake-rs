[package]
name = "shiguredo_cmake"
version = "4.5.1"
edition = "2024"
rust-version = "1.93"
description = "Download and cache prebuilt CMake binaries from official GitHub releases"
readme = "README.md"
homepage = "https://github.com/shiguredo/cmake-rs"
repository = "https://github.com/shiguredo/cmake-rs"
license = "Apache-2.0"
include = ["/build.rs", "/src/**", "LICENSE", "README.md"]

[package.metadata.external-dependencies.cmake]
version = "4.5.1"

[package.metadata.external-dependencies.cmake.sha256]
macos-universal = "e1fb288543e4eb2a410e385ecebc64323bda51f0205782f2b094ccd5d572ca2d"
linux-x86_64 = "83b71181fb62b4fe8f26067a9321448572e7a43bd04ff6c7f54a24c33698f16d"
linux-aarch64 = "3bec208f11ed96c173032eeaf97937c54dd246acefee22acd7794a6b4e70d536"
windows-x86_64 = "bfe6eadb245dc8213e0d3feea316b520cb2aae92f5667ffd76059ba6b05c430c"
windows-arm64 = "6782f11382941bb85c406eb3bd32a702222d8956535ae9cec5ee77395be2cc78"

[[bin]]
name = "cmake"
path = "src/main.rs"

[dependencies]
cmake = "0.1"

[build-dependencies]
shiguredo_toml = "2026.2"
