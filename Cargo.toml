[package]
name = "shiguredo_cmake"
version = "4.4.4"
edition = "2024"
rust-version = "1.93"
description = "Download and cache prebuilt CMake binaries from official GitHub releases"
readme = "README.md"
homepage = "https://github.com/shiguredo/cmake-rs"
repository = "https://github.com/shiguredo/cmake-rs"
license = "Apache-2.0"
include = ["/build.rs", "/src/**", "LICENSE", "README.md"]

[package.metadata.external-dependencies.cmake]
version = "4.4.4"

[package.metadata.external-dependencies.cmake.sha256]
macos-universal = "4b7b73704b1db9b374e5c9ab8e17ac6148b817b6396ee75cd94a852cbac9d305"
linux-x86_64 = "e5bb807f7728cb60cd8b27ebc97a2edb469b68655f21e844a600c3575b76f5bb"
linux-aarch64 = "a1b6cc63636a0e55c63257cf3315a8a5f129e42fade25db1afea4ff8ab06f25e"
windows-x86_64 = "bace36e94b31c68ab6fa295f26dfa11219e0701cf7c94b0284a7d1cb13dac536"
windows-arm64 = "ed673bbc4eb7c1e59b0407fd52f1680fc0ae3229a46b9b7b3ea9133764f07f67"

[[bin]]
name = "cmake"
path = "src/main.rs"

[dependencies]
cmake = "0.1"

[build-dependencies]
shiguredo_toml = "2026.2"
