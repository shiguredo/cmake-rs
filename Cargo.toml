linux-x86_64 = "3864eb649b4466ae126a64bbde1657adad78efbbaa068bf38201de5cf1b5349f"
linux-aarch64 = "e98bb53e0b00a8f672424517d34c05bb9b94fd1c888c89e0b81bc8df51d1a94b"
windows-x86_64 = "156d70eb7625a7b469444df7d0861d2af8d5d0a437fce32c350372b08f5620e8"
windows-arm64 = "57437e918b2929bbd25b8d427611120149df02d4b216872e0f48f361f03d71e5"

[[bin]]
name = "cmake"
path = "src/main.rs"

[dependencies]
cmake = "0.1"

[build-dependencies]
